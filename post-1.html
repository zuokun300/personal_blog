    <script>

                extend: {
                    colors: {
                        bg: { primary: '#0a0e14', secondary: '#111827', card: '#1f2937', hover: '#374151' },
                        accent: { primary: '#3b82f6', secondary: '#8b5cf6', glow: 'rgba(59, 130, 246, 0.5)' }

<body class="min-h-screen">

                    <p>在技术快速迭代的今天，能够清晰地表达自己的想法变得越来越重要。博客不仅是记录，更是思考的延伸。</p>
